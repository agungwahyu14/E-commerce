<div id="chatbot-page">
    <!-- Stats Row -->
    <div class="stats-grid" style="margin-bottom: 25px;">
        <div class="stat-card">
            <div class="stat-icon blue">🤖</div>
            <div class="stat-info">
                <h3>Total Rules</h3>
                <div class="value" id="stat-total-rules">0</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon green">✅</div>
            <div class="stat-info">
                <h3>Rules Aktif</h3>
                <div class="value" id="stat-active-rules">0</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon orange">⚠️</div>
            <div class="stat-info">
                <h3>Rules Nonaktif</h3>
                <div class="value" id="stat-inactive-rules">0</div>
            </div>
        </div>
    </div>

    <!-- Toolbar -->
    <div class="data-card" style="margin-bottom: 25px; padding: 20px;">
        <div style="display: flex; gap: 15px; align-items: center; justify-content: space-between;">
            <div style="display: flex; gap: 10px;" id="category-tabs">
                <button class="tab-btn active" data-category="">All</button>
                <button class="tab-btn" data-category="greeting">Greeting</button>
                <button class="tab-btn" data-category="order">Order</button>
                <button class="tab-btn" data-category="product">Product</button>
                <button class="tab-btn" data-category="price">Price</button>
                <button class="tab-btn" data-category="help">Help</button>
                <button class="tab-btn" data-category="custom">Custom</button>
            </div>
            <button onclick="openAddModal()" style="background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 10px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                <i class="fas fa-plus"></i> Tambah Rule
            </button>
        </div>
    </div>

    <!-- Rules Table -->
    <div class="data-card" style="margin-bottom: 30px;">
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th style="width: 50px;">No</th>
                        <th>Category</th>
                        <th>Keywords</th>
                        <th>Response Template</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="rules-table-body">
                    <!-- Rules rendered by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Test Section -->
    <div class="data-card" style="padding: 25px; background: #f8f9fc;">
        <h2 style="font-weight: 800; font-size: 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
            <i class="fas fa-vial" style="color: var(--primary);"></i> Test Chatbot
        </h2>
        <div style="display: flex; gap: 15px; margin-bottom: 20px;">
            <input type="text" id="testMessageInput" placeholder="Ketik pesan untuk simulasi bot..." style="flex: 1; padding: 12px 15px; border-radius: 10px; border: 1px solid var(--border); outline: none;">
            <button onclick="testMessage()" style="background: var(--sidebar-bg); color: white; border: none; padding: 0 30px; border-radius: 10px; font-weight: 700; cursor: pointer;">Test</button>
        </div>
        <div id="testResult" style="display: none; padding: 20px; border-radius: 12px; border: 1px solid var(--border); background: white;">
            <!-- Result rendered by JS -->
        </div>
    </div>

    <!-- Modal Form -->
    <div id="ruleModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center;">
        <div style="background: white; width: 100%; max-width: 650px; border-radius: 20px; overflow: hidden; position: relative; animation: slideUp 0.3s ease; max-height: 90vh; overflow-y: auto;">
            <div style="padding: 20px 25px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
                <h2 id="modalTitle" style="font-weight: 800; font-size: 18px;">Tambah Chatbot Rule</h2>
                <button onclick="closeModal()" style="background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted);">&times;</button>
            </div>
            
            <form id="ruleForm" style="padding: 25px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <input type="hidden" id="ruleId">
                
                <div>
                    <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px;">Kategori</label>
                    <select id="category" required style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); outline: none;">
                        <option value="greeting">Greeting</option>
                        <option value="order">Order</option>
                        <option value="product">Product</option>
                        <option value="price">Price</option>
                        <option value="help">Help</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>

                <div>
                    <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px;">Priority (Higher = Sooner)</label>
                    <input type="number" id="priority" value="0" required style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); outline: none;">
                </div>

                <div style="grid-column: span 2;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px;">Keywords (Satu per baris)</label>
                    <textarea id="keywords" required placeholder="halo\nhi\nhello" style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); outline: none; height: 100px; resize: none; font-family: monospace;"></textarea>
                </div>

                <div style="grid-column: span 2;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px;">Response Template</label>
                    <textarea id="response" required placeholder="Halo {userName}..." style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); outline: none; height: 120px; resize: none;"></textarea>
                    <div style="margin-top: 8px; display: flex; gap: 10px;">
                        <span style="font-size: 11px; background: #f1f1f2; padding: 2px 8px; border-radius: 4px; color: #555;">{userName}</span>
                        <span style="font-size: 11px; background: #f1f1f2; padding: 2px 8px; border-radius: 4px; color: #555;">{orderCount}</span>
                    </div>
                </div>

                <div style="display: flex; align-items: center; gap: 10px;">
                    <label class="switch">
                        <input type="checkbox" id="isActive" checked>
                        <span class="slider round"></span>
                    </label>
                    <span style="font-weight: 600; font-size: 14px;">Rule Aktif</span>
                </div>

                <div style="grid-column: span 2; display: flex; justify-content: flex-end; gap: 12px; margin-top: 10px;">
                    <button type="button" onclick="closeModal()" style="padding: 12px 20px; border-radius: 10px; border: 1px solid var(--border); background: white; font-weight: 600; cursor: pointer;">Batal</button>
                    <button type="submit" id="saveBtn" style="padding: 12px 30px; border-radius: 10px; background: var(--primary); color: white; border: none; font-weight: 700; cursor: pointer;">Simpan Rule</button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
.tab-btn { padding: 10px 18px; border-radius: 10px; border: 1px solid var(--border); background: white; cursor: pointer; font-weight: 600; font-size: 13px; transition: 0.3s; color: var(--text-muted); }
.tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

.keyword-chip { font-size: 11px; background: #f1f1f2; color: #333; padding: 2px 8px; border-radius: 4px; margin-right: 4px; display: inline-block; }

.switch { position: relative; display: inline-block; width: 40px; height: 22px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
.slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
input:checked + .slider { background-color: var(--primary); }
input:focus + .slider { box-shadow: 0 0 1px var(--primary); }
input:checked + .slider:before { transform: translateX(18px); }

.category-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
.cat-greeting { background: #E1F0FF; color: #009EF7; }
.cat-order { background: #EEE5FF; color: #8950FC; }
.cat-product { background: #E8FFF3; color: #50CD89; }
.cat-price { background: #FFF4DE; color: #FFA800; }
.cat-help { background: #F1F1F2; color: #3F4254; }
.cat-custom { background: #FFF5F8; color: #F1416C; }
</style>

<script src="/admin/js/pages/chatbot.js"></script>
