<div id="transactions-page">
    <!-- Stats Row -->
    <div class="stats-grid" style="margin-bottom: 25px;">
        <div class="stat-card">
            <div class="stat-icon" style="background: #E8FFF3; color: #50CD89;"><i class="fas fa-hand-holding-usd"></i></div>
            <div class="stat-info">
                <h3>Total Revenue</h3>
                <div class="value" id="stat-total-revenue">Rp 0</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon" style="background: #F1FAFF; color: #009EF7;"><i class="fas fa-file-invoice-dollar"></i></div>
            <div class="stat-info">
                <h3>Total Transaksi</h3>
                <div class="value" id="stat-total-transactions">0</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon" style="background: #FFF8DD; color: #FFA800;"><i class="fas fa-clock"></i></div>
            <div class="stat-info">
                <h3>Pending</h3>
                <div class="value" id="stat-pending-transactions">0</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon" style="background: #FFF5F8; color: #F1416C;"><i class="fas fa-times-circle"></i></div>
            <div class="stat-info">
                <h3>Gagal/Cancel</h3>
                <div class="value" id="stat-failed-transactions">0</div>
            </div>
        </div>
    </div>

    <!-- Toolbar -->
    <div class="data-card" style="margin-bottom: 25px; padding: 20px;">
        <div style="display: flex; gap: 15px; align-items: center;">
            <div style="font-weight: 700; margin-right: 10px;">Filter:</div>
            <select id="paymentStatusFilter" style="padding: 10px 15px; border-radius: 10px; border: 1px solid var(--border); outline: none; min-width: 150px;">
                <option value="">All Payment Status</option>
                <option value="paid">Paid</option>
                <option value="unpaid">Unpaid</option>
                <option value="refunded">Refunded</option>
            </select>
            <button onclick="loadTransactions()" style="background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 10px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
            <button onclick="syncAllTransactions()" id="syncAllBtn" style="background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; margin-left: auto;">
                <i class="fas fa-bolt"></i> Sync Semua Pending
            </button>
        </div>
    </div>

    <!-- Table -->
    <div class="data-card">
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Midtrans Order ID</th>
                        <th>Customer</th>
                        <th>Total</th>
                        <th>Payment Status</th>
                        <th>Order Status</th>
                        <th>Tanggal</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="transactions-table-body">
                    <!-- Data rendered by JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<style>
.badge { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
.badge-paid { background: #E8FFF3; color: #50CD89; }
.badge-unpaid { background: #FFF8DD; color: #FFA800; }
.badge-refunded { background: #F1FAFF; color: #009EF7; }

.order-status { display: flex; align-items: center; gap: 5px; font-weight: 600; font-size: 13px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; }
</style>

<script src="/admin/js/pages/transactions.js"></script>
